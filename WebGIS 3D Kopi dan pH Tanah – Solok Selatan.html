const $=id=>document.getElementById(id),fm=n=>Math.round(n).toLocaleString('id-ID'),f2=n=>n.toFixed(2).replace('.',',');

const T={Tinggi:'#d72d2d',Sedang:'#fcc83c',Rendah:'#1ab050',Kosong:'#9a9a9a'};
const PN={Tinggi:'Prioritas tinggi',Sedang:'Prioritas sedang',Rendah:'Prioritas rendah',Kosong:'Tanpa kebun terdeteksi'};
const NOTE={Tinggi:'Lebih dari separuh kebun tergolong sangat asam; pengapuran paling mendesak.',Sedang:'Sebagian kebun perlu dikapur.',Rendah:'Asam ringan, cukup tambah kompos.',Kosong:'Hampir tidak ada kebun kopi terdeteksi.'};
const CL=[['Sangat asam (pH<4,5)','#d72d2d','sa'],['Asam (4,5–5,0)','#f0961e','a'],['Asam ringan (5,0–5,5)','#e6c828','ar'],['Mendekati ideal (≥5,5)','#3cab3c','id']];
let cm='pr',hm='ha',selI=-1,az=.6,el=.95,d=9;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let sx=0,sy=0,n=0;D.forEach(o=>o.g.forEach(g=>g.forEach(p=>{sx+=p[0];sy+=p[1];n++})));
const cx=sx/n,cy=sy/n,kx=111.32*Math.cos(cy*Math.PI/180),ky=110.57,S=.1;
const P=p=>new THREE.Vector2((p[0]-cx)*kx*S,(p[1]-cy)*ky*S);

scn.add(new THREE.HemisphereLight(0xffffff,0x667766,.9));const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(3,6,4);scn.add(dl);
const meshes=[];
D.forEach((o,i)=>{o.m=[];o.h=.1;o.g.forEach(g=>{const geo=new THREE.ExtrudeGeometry(new THREE.Shape(g.map(P)),{depth:1,bevelEnabled:false});
const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial());m.rotation.x=-Math.PI/2;m.scale.z=.001;m.userData.i=i;
m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,40),new THREE.LineBasicMaterial({color:0x111111,transparent:true,opacity:.45})));
scn.add(m);meshes.push(m);o.m.push(m)})});

function paint(){D.forEach((o,i)=>{const e=o.ha<1;
const c=e?new THREE.Color('#9a9a9a'):cm=='pr'?new THREE.Color(T[o.pr]):pc(o.ph);
o.h=.1+(hm=='ha'?Math.sqrt(o.ha)*.05:(e?0:o.sa/o.ha)*2.2);
o.m.forEach(m=>{m.material.color.copy(c);m.material.emissive.setHex(i==selI?0x555555:0)})});

function panel(){const p=$('pn'),DS='<div class="m">Indikasi dari estimasi satelit 250 m, bukan data resmi pemerintah. Uji tanah langsung tetap perlu.</div>';
if(selI<0){p.innerHTML=`<b>Ringkasan 39 nagari</b><div class="st"><div><b>5.180 ha</b><small>kebun kopi</small></div><div><b>pH 4,62</b><small>rata-rata (ideal 5,5–6,5)</small></div></div>
<div class="st"><div><b>1.784 ha</b><small>sangat asam (34%)</small></div><div><b>0 ha</b><small>mendekati ideal</small></div></div>
<div class="m">Ketuk nagari di peta, atau pilih prioritas tinggi:</div>${D.map((o,i)=>o.pr=='Tinggi'?`<button class="ch" data-i="${i}">${o.n}</button>`:'').join('')}<p>${DS}</p>`;return}

<div class="st"><div><b>${fm(o.ha)} ha</b><small>kebun kopi</small></div><div><b>${f2(o.ph)}</b><small>pH rata-rata</small></div><div><b>${o.ha>=1?Math.round(o.sa/o.ha*100):0}%</b><small>sangat asam</small></div></div>
<div class="bar">${CL.map(c=>`<div style="width:${o[c[2]]/t*100}%;background:${c[1]}"></div>`).join('')}</div>
<div class="m">${CL.map(c=>`<i style="display:inline-block;width:8px;height:8px;background:${c[1]};border-radius:2px"></i> ${c[0]}: ${fm(o[c[2]])} ha`).join('<br>')}</div>
<p>${NOTE[o.pr]}</p><button class="ch" data-i="-1">← Ringkasan</button><p>${DS}</p>`}
function sel(i){selI=i;paint();panel()}
$('pn').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)sel(+b.dataset.i)});
$('c1').onclick=()=>{cm='pr';paint()};$('c2').onclick=()=>{cm='ph';paint()};$('h1').onclick=()=>{hm='ha';paint()};$('h2').onclick=()=>{hm='sa';paint()};
$('rs').onclick=()=>{az=.6;el=.95;d=9;sel(-1)};
const cv=ren.domElement,ptr=new Map();let dn=null,pd=0;
const pinch=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);dn=[e.clientX,e.clientY,Date.now()];pd=ptr.size==2?pinch():0});
cv.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);if(!o)return;
if(ptr.size==1){az-=(e.clientX-o[0])*.008;el=clamp(el+(e.clientY-o[1])*.006,.25,1.5)}
ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==2){const k=pinch();if(pd)d=clamp(d*pd/k,3,16);pd=k}});
const rc=new THREE.Raycaster(),v2=new THREE.Vector2();
cv.addEventListener('pointerup',e=>{if(ptr.size==1&&dn&&Math.hypot(e.clientX-dn[0],e.clientY-dn[1])<7&&Date.now()-dn[2]<350){
const r=cv.getBoundingClientRect();v2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);rc.setFromCamera(v2,cam);
const h=rc.intersectObjects(meshes)[0];sel(h?h.object.userData.i:-1)}ptr.delete(e.pointerId);pd=0});
cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);pd=0});
cv.addEventListener('wheel',e=>{e.preventDefault();d=clamp(d*(1+e.deltaY*.001),3,16)},{passive:false});
function rs(){const r=$('st').getBoundingClientRect();ren.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}
new ResizeObserver(rs).observe($('st'));
paint();panel();
(function loop(){requestAnimationFrame(loop);D.forEach(o=>o.m.forEach(m=>{m.scale.z+=(o.h-m.scale.z)*.15}));
cam.position.set(d*Math.cos(el)*Math.sin(az),d*Math.sin(el),d*Math.cos(el)*Math.cos(az));cam.lookAt(0,.3,0);ren.render(scn,cam)})();
